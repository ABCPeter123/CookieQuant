name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify built releases and run tests
        run: |
          npm run check
          node --check dashboard/js/app.js
          node --check dashboard/js/live.js
          node --check dashboard/js/quant-terminal.js
          node --check dashboard/js/quant-math.js
          node --check dashboard/js/model.js
          node --check dashboard/api/history.js
          node --check dashboard/api/health.js
          node --check dashboard/js/telemetry-health.js
          node --check dashboard/lib/health-core.js
          node --check dashboard/api/live.js
          node --check dashboard/api/telemetry.js
